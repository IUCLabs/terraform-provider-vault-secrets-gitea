when:
  - event: tag

steps:
  - name: package
    image: git.unkin.net/unkin/almalinux9-gobuilder:20260606
    commands:
      - make package VERSION=${CI_COMMIT_TAG}
    backend_options:
      kubernetes:
        serviceAccountName: default
        resources:
          requests:
            memory: 512Mi
            cpu: 1
          limits:
            memory: 2Gi
            cpu: 2

  - name: upload
    image: git.unkin.net/unkin/almalinux9-base:20260606
    commands:
      - |
        VERSION=$$(echo ${CI_COMMIT_TAG} | sed 's/^v//')
        FILE="terraform-provider-giteavaultsecret_$${VERSION}_linux_amd64.zip"
        set -o pipefail
        VAULT="https://vault.service.consul:8200"
        AUTH=$$(mktemp)
        VT=$$(jq -n --rawfile jwt /var/run/secrets/kubernetes.io/serviceaccount/token '{role:"woodpecker_artifactapi_writer",jwt:$$jwt}' \
          | curl -sf -d @- "$$VAULT/v1/auth/k8s/au/syd1/login" | jq -er .auth.client_token) || exit 1
        printf 'X-Vault-Token: %s\n' "$$VT" | curl -sf -H @- "$$VAULT/v1/identity/oidc/token/artifactapi-writer" \
          | jq -er '"Authorization: Bearer " + .data.token' > "$$AUTH" || exit 1
        curl -f -X PUT \
          "https://artifactapi.k8s.syd1.au.unkin.net/api/v2/remotes/terraform-unkin/files/unkin/giteavaultsecret/$${FILE}" \
          -H "Content-Type: application/zip" -H @"$$AUTH" \
          --data-binary @"$${FILE}"
    depends_on: [package]
    backend_options:
      kubernetes:
        serviceAccountName: default
        resources:
          requests:
            memory: 128Mi
            cpu: 100m
          limits:
            memory: 512Mi
            cpu: 500m
